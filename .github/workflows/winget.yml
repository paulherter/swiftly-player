# Submits every published release as an update PR to microsoft/winget-pkgs.
#
# Not handled here: the very first submission. winget-releaser needs at least
# one existing version in the community repository as a template; that one is
# submitted by hand once (see Distribution/SETUP.md). Later runs build on it.

name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Freigabe-Tag, z. B. v1.0.4 (nur fuer einen Nachlauf noetig)'
        required: false
        default: ''

jobs:
  veroeffentlichen:
    # Betas are not offered there, and nothing runs until the package exists
    # (repository variable WINGET_READY = true, see Distribution/SETUP.md).
    if: ${{ vars.WINGET_READY == 'true' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Ins winget-pkgs-Repository stellen
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: PaulHerter.SwiftlyPlayer
          installers-regex: 'Swiftly-.*-Setup\.exe$'
          release-tag: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
