# Submits every published release as an update PR to microsoft/winget-pkgs.
#
# Not handled here: the very first submission. winget-releaser needs at least
# one existing version in the community repository as a template; that one is
# submitted by hand once (see Distribution/SETUP.md). Later runs build on it.
#
# The release asset is `Swiftly-Player-<version>-win-x64-Setup.exe`, an NSIS
# installer (`/S` for a silent run). The portable zip in the same release does
# not match the pattern below and is never submitted. The earlier releases used
# an Inno Setup installer, and the action copies the installer type and switches
# from the latest version already in winget-pkgs. So the first NSIS version
# (1.1.0) is submitted by hand from `Distribution/winget/1.1.0/`, and
# WINGET_READY is set only after that one is merged.

name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Freigabe-Tag, z. B. v1.0.4 (nur fuer einen Nachlauf noetig)'
        required: false
        default: ''

jobs:
  veroeffentlichen:
    # Betas are not offered there, and nothing runs until the package exists
    # (repository variable WINGET_READY = true, see Distribution/SETUP.md).
    if: ${{ vars.WINGET_READY == 'true' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Ins winget-pkgs-Repository stellen
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: PaulHerter.SwiftlyPlayer
          installers-regex: '^Swiftly-Player-.*-win-x64-Setup\.exe$'
          release-tag: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
