# Schiebt jede veroeffentlichte Fassung als Aktualisierungs-PR in
# microsoft/winget-pkgs.
#
# **Was hier NICHT passiert:** die allererste Einreichung. winget-releaser
# braucht mindestens eine bereits vorhandene Fassung im Community-Repository
# als Vorlage - die legt Paul einmal von Hand an (siehe Verteilung/EINRICHTEN.md).
# Erst danach bauen spaetere Laeufe darauf auf.

name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Freigabe-Tag, z. B. v1.0.4 (nur fuer einen Nachlauf noetig)'
        required: false
        default: ''

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    steps:
      - name: Ins winget-pkgs-Repository stellen
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: PaulHerter.SwiftlyPlayer
          installers-regex: 'Swiftly-.*-Setup\.exe$'
          release-tag: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
