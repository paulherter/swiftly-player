# Updates the AUR package swiftly-player-bin on every release.
#
# The package itself has to be created in the AUR by hand once (see
# Distribution/SETUP.md). After that, this run rewrites pkgver and the checksum
# of the release tarball and pushes them to the AUR git repository.

name: AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      fassung:
        description: 'Fassung, z. B. 1.0.4'
        required: true
        default: '1.0.3'

jobs:
  veroeffentlichen:
    # Betas are not offered there, and nothing runs until the package exists
    # (repository variable AUR_READY = true, see Distribution/SETUP.md).
    if: ${{ vars.AUR_READY == 'true' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fassung bestimmen
        id: f
        run: |
          if [ -n "${{ github.event.inputs.fassung }}" ]; then
            echo "wert=${{ github.event.inputs.fassung }}" >> "$GITHUB_OUTPUT"
          else
            echo "wert=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: PKGBUILD mit der neuen Fassung fuellen
        run: |
          mkdir -p aur-arbeit
          sed "s/^pkgver=.*/pkgver=${{ steps.f.outputs.wert }}/" \
            Distribution/aur/swiftly-player-bin/PKGBUILD > aur-arbeit/PKGBUILD

      # updpkgsums downloads the new tarball and writes the checksum into the
      # copy under aur-arbeit. The template in the repository stays untouched.
      - name: Ins AUR stellen
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: swiftly-player-bin
          pkgbuild: ./aur-arbeit/PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "swiftly-player-bin ${{ steps.f.outputs.wert }}"
