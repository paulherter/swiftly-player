# Linux-Pakete bauen und in die Paketquelle stellen.
#
# **Warum eine Baumaschine und nicht die eigene Kiste.** Ein uebersetztes
# Programm haengt an der glibc des Rechners, auf dem es entstand. Die
# Entwicklungskiste laeuft auf CachyOS mit 2.44 — dort gebaut startet es auf
# nichts anderem. Ubuntu 24.04 hat 2.39 und GTK 4.14, und das ist genau der
# Boden, den unsere App ohnehin braucht: aeltere Ausgaben von Debian oder
# Ubuntu bringen GTK 4.8 mit und koennten die App gar nicht anzeigen.
#
# Was hier herausfaellt, landet auf GitHub Pages als apt- und dnf-Quelle.
# Ab da holt der Paketverwalter des Nutzers neue Fassungen von selbst.

name: Linux-Pakete

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      fassung:
        description: 'Fassung, z. B. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bauen:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble

    steps:
      - name: Werkzeuge
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libvlc-dev pkg-config g++ git \
            rpm dpkg-dev apt-utils createrepo-c gnupg ca-certificates

      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Fassung bestimmen
        id: f
        run: |
          if [ -n "${{ github.event.inputs.fassung }}" ]; then
            echo "wert=${{ github.event.inputs.fassung }}" >> "$GITHUB_OUTPUT"
          else
            echo "wert=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: rlottie
        run: |
          export SWIFTLY_RLOTTIE_ZIEL="$PWD/.rlottie"
          bash Werkzeuge/rlottie-bauen.sh "$PWD/.rlottie-quelle"

      - name: Swiftly bauen
        run: |
          export PKG_CONFIG_PATH="$PWD/.rlottie/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cd Linux
          swift build -c release -Xswiftc -static-stdlib

      - name: Pakete schnueren
        run: |
          bash Linux/Installieren/paket-bauen.sh \
            "${{ steps.f.outputs.wert }}" \
            "$PWD/Linux/.build/release" \
            "$PWD/pakete"

      # Ohne Schluessel entsteht eine unsignierte Quelle. Die funktioniert,
      # aber apt maeckert bei jedem Aufruf — deshalb wird signiert, sobald
      # das Geheimnis SIGNIERSCHLUESSEL im Verwahr liegt.
      - name: Paketquelle bauen
        env:
          SCHLUESSEL: ${{ secrets.SIGNIERSCHLUESSEL }}
        run: |
          mkdir -p seite/deb seite/rpm
          cp pakete/*.deb seite/deb/
          cp pakete/*.rpm seite/rpm/
          ( cd seite/deb && dpkg-scanpackages . /dev/null > Packages && gzip -9kf Packages
            apt-ftparchive release . > Release )
          createrepo_c seite/rpm
          if [ -n "$SCHLUESSEL" ]; then
            echo "$SCHLUESSEL" | gpg --batch --import
            kennung=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
            gpg --batch --yes --armor --detach-sign -u "$kennung" \
                -o seite/deb/Release.gpg seite/deb/Release
            gpg --batch --yes --clearsign -u "$kennung" -o seite/deb/InRelease seite/deb/Release
            for r in seite/rpm/*.rpm; do
              rpm --define "_gpg_name $kennung" --addsign "$r" || true
            done
            gpg --batch --yes --armor --export "$kennung" > seite/swiftly.gpg
            echo "signiert mit $kennung"
          else
            echo "::warning::Kein SIGNIERSCHLUESSEL hinterlegt — die Quelle bleibt unsigniert."
          fi
          cp Linux/Installieren/quelle-einrichten.sh seite/ 2>/dev/null || true
          echo "swiftly-for-jellyfin" > seite/.nojekyll

      - name: Auf Pages stellen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./seite
          publish_branch: gh-pages
          keep_files: true

      - name: An die Veroeffentlichung haengen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pakete/*

  # Arch ist rollend, also wird dort gegen die heutigen Bibliotheken gebaut —
  # ein Paket aus dem Ubuntu-Lauf waere gegen zu alte gebunden. Dafuer gibt es
  # eine eigene pacman-Quelle statt eines AUR-Eintrags: der AUR braucht ein
  # Konto und einen Schluessel, die pacman-Quelle nur eine Zeile in
  # pacman.conf — und aktualisiert wird sie mit jedem `pacman -Syu`.
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    needs: bauen

    steps:
      - name: Werkzeuge
        run: |
          # Die letzten vier stehen fuer die Toolchain, nicht fuer die App:
          # sie kommt von Ubuntu 24.04 und sucht Bibliotheken unter deren
          # Namen. `libxml2-legacy` ist die mit soname 2 — Arch liefert
          # inzwischen 16, und der Uebersetzer startet ohne sie gar nicht.
          pacman -Syu --noconfirm --needed \
            gtk4 vlc git gcc pkgconf curl unzip which sudo gnupg \
            libxml2-legacy icu python sqlite libedit ncurses zlib
          useradd -m bauer
          echo "bauer ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: Fassung bestimmen
        id: f
        run: |
          if [ -n "${{ github.event.inputs.fassung }}" ]; then
            echo "wert=${{ github.event.inputs.fassung }}" >> "$GITHUB_OUTPUT"
          else
            echo "wert=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # swiftly kennt Arch nicht ("Unsupported Linux platform") und bricht
      # sonst ab. Die Toolchain von Ubuntu 24.04 laeuft hier trotzdem: Arch
      # hat die neuere glibc. Nur libncurses heisst dort anders.
      - name: Swift
        run: |
          [ -e /usr/lib/libncurses.so.6 ] ||
            ln -sf /usr/lib/libncursesw.so.6 /usr/lib/libncurses.so.6
          # Die Ablage wird ausdruecklich gesetzt. swiftly sucht sie sonst
          # ueber den passwd-Eintrag und landete unter /root, waehrend HOME
          # im Behaelter auf /github/home zeigt — danach war `swiftly` nicht
          # zu finden.
          export SWIFTLY_HOME_DIR="$HOME/.swiftly" SWIFTLY_BIN_DIR="$HOME/.swiftly/bin"
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-x86_64.tar.gz"
          tar -xzf swiftly-x86_64.tar.gz
          ./swiftly init --quiet-shell-followup --assume-yes --skip-install \
            --platform ubuntu24.04
          export PATH="$SWIFTLY_BIN_DIR:$PATH"
          # swiftly meldet die Toolchain als erfolgreich installiert und geht
          # trotzdem mit 1 heraus — es beklagt die Sitzung, die seine
          # Pfadaenderung noch nicht kennt. Geprueft wird deshalb am
          # Uebersetzer selbst, nicht am Rueckgabewert.
          swiftly install --use latest || true
          "$SWIFTLY_BIN_DIR/swift" --version
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
          echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR" >> "$GITHUB_ENV"
          echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR" >> "$GITHUB_ENV"

      - name: Bauen
        run: |
          export SWIFTLY_RLOTTIE_ZIEL="$PWD/.rlottie"
          bash Werkzeuge/rlottie-bauen.sh "$PWD/.rlottie-quelle"
          export PKG_CONFIG_PATH="$PWD/.rlottie/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cd Linux && swift build -c release -Xswiftc -static-stdlib

      - name: Paket schnueren
        run: |
          bash Linux/Installieren/pacman-paket.sh \
            "${{ steps.f.outputs.wert }}" "$PWD/Linux/.build/release" "$PWD/pakete"

      # pacman prueft je Paket eine eigene .sig-Datei, nicht die Datenbank —
      # deshalb wird hier jedes Paket einzeln signiert und `repo-add -s`
      # setzt die Signatur der Datenbank obendrauf.
      - name: In die pacman-Quelle
        env:
          SCHLUESSEL: ${{ secrets.SIGNIERSCHLUESSEL }}
        run: |
          mkdir -p seite/arch
          cp pakete/*.pkg.tar.zst seite/arch/
          if [ -n "$SCHLUESSEL" ]; then
            echo "$SCHLUESSEL" | gpg --batch --import
            kennung=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
            for paket in seite/arch/*.pkg.tar.zst; do
              gpg --batch --yes --detach-sign --no-armor -u "$kennung" "$paket"
            done
            repo-add -s -v -k "$kennung" seite/arch/swiftly.db.tar.gz seite/arch/*.pkg.tar.zst
            gpg --batch --yes --armor --export "$kennung" > seite/swiftly.gpg
          else
            echo "::warning::Kein SIGNIERSCHLUESSEL — die pacman-Quelle bleibt unsigniert."
            repo-add seite/arch/swiftly.db.tar.gz seite/arch/*.pkg.tar.zst
          fi

      - name: Auf Pages stellen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./seite
          publish_branch: gh-pages
          keep_files: true
