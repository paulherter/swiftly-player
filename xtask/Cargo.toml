[package]
name = "xtask"
description = "Build tasks: `cargo run -p xtask -- apple` builds the Apple staticlibs, Swift bindings and the xcframework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "xtask"

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
png = "0.18.1"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true
