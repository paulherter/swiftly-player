# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
#
# No scope set: Swiftly.iss uses PrivilegesRequiredOverridesAllowed=dialog, not
# "commandline". The installer lets the user choose between their own folder and
# Program Files in the dialog, but ignores /CURRENTUSER and /ALLUSERS on the
# command line. A silent run (winget) therefore falls back to Inno Setup's
# default (admin, Program Files).

PackageIdentifier: PaulHerter.SwiftlyPlayer
PackageVersion: 1.0.3
Platform:
- Windows.Desktop
InstallerType: inno
InstallerSwitches:
  Silent: /VERYSILENT /NORESTART
  SilentWithProgress: /SILENT /NORESTART
UpgradeBehavior: install
ReleaseDate: 2026-09-17
