    dependencies:
      - package: JellyfinKit
      # For the launch animation - same asset as iPhone and TV. Without it the
      # Mac would start without the animation.
      - package: Lottie
      # Self-built version - see Werkzeuge/vlckit-patches/README.md.
      - framework: Vendor/VLCKit-gepatcht.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/macOS/Info.plist
      properties:
        # **The fallback language, not the source language.**
        #
        # German stays the key in the catalog. A device set to neither German
        # nor English (Dutch, Russian, Chinese) gets exactly this value: Apple's
        # last fallback level is CFBundleDevelopmentRegion (QA1828). With `de`
        # here, much of the world saw a German app.
        #
        # Not via `options.developmentLanguage`: that is the project's source
        # language and stays German.
        CFBundleDevelopmentRegion: en
        # **Without this the store rejects the upload** (error 90242): a Mac app
        # must carry its category in Info.plist, not only in the store listing.
        # iOS and tvOS do not require it, so it only shows on the first Mac
        # upload.
        LSApplicationCategoryType: public.app-category.entertainment
        # **Mac build numbers must be strictly ascending across all versions.**
        #
        # iOS and tvOS only require an increase per version, but for the Mac the
        # check is per app record, and the upload is rejected:
        #
        #     CFBundleVersion [1] must contain a higher version than that of the previously uploaded version [2]   (90061)
        #
        # So the next Mac build must be higher than the highest ever uploaded
        # for the Mac.
        #
        # The number is a **build setting** (`CURRENT_PROJECT_VERSION`), not a
        # literal key here: this block becomes the Info.plist, where a literal
        # would be ignored in favor of the project value.
        CFBundleDisplayName: Swiftly
        # **The bundle name is "Swiftly", not "Swiftly-macOS".**
        #
        # Apple rejected a build over this (guideline 5.2.5): the displayed name
        # contained a term for an Apple product. On the Mac `CFBundleName`
        # appears in the menu bar and under the icon in Finder; without this
        # line it falls back to the target name. `CFBundleDisplayName` alone is
        # not enough, as the Mac does not read it everywhere.
        CFBundleName: Swiftly
        # **The icon additionally as a complete `.icns`.**
        #
        # The `AppIcon.icns` Xcode generates from the catalog contains only the
        # 16 and 128 sizes; 32, 256, 512 and 1024 are missing, and the Dock
        # needs the large ones. The one next to it is built with `iconutil` from
        # the same ten images and is complete.
        CFBundleIconFile: Swiftly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No light theme - the design is built for dark, and without this macOS
        # draws the window buttons light.
        NSRequiresAquaSystemAppearance: false
        NSAppTransportSecurity:
          # **Only this one key, on purpose.**
          #
          # Adding `NSAllowsLocalNetworking` next to it is wrong: **since iOS
          # 10, `NSAllowsArbitraryLoads` is ignored as soon as
          # `NSAllowsLocalNetworking`, `NSAllowsArbitraryLoadsInWebContent` or
          # `...ForMedia` is present.** The keys do not complement each other;
          # the second disables the first.
          #
          # This blocked users reaching Jellyfin over Tailscale
          # (`http://100.x.x.x:8096`): Tailscale uses 100.64.0.0/10, the CGNAT
          # range, which ATS does **not** count as local network (RFC1918,
          # `.local` and `localhost` are). The same block hit plain-http
          # dynamic-DNS hostnames.
          #
          # A client for self-hosted servers cannot know the address at build
          # time, so `NSExceptionDomains` do not help. Swiftly steers towards
          # https in code instead: an address without scheme gets `https://`
          # prepended unless it looks like a home network
          # (`AppModelURLNormalizer`, IP literals included). It falls back to
          # http only if https fails at the connection level, never on an error
          # response.
          NSAllowsArbitraryLoads: true
        # **Required since iOS 14; without it the error is hard to interpret.**
        #
        # The system asks for permission before an app talks to devices on the
        # local network, even for a direct IP, not only `.local`. If the user
        # denies, URLSession reports "The Internet connection appears to be
        # offline" although the network is fine. This sentence is shown in the
        # prompt itself and is the only chance to explain why the app wants it.
        #
        # **English as default, German from `InfoPlist.xcstrings`.** A
        # hard-coded plist value is not translated; it appears as written. Since
        # `CFBundleDevelopmentRegion` is `en`, this sentence must be English
        # too.
        NSLocalNetworkUsageDescription: Swiftly looks for your Jellyfin server
          on your home network. Without this, the app cannot reach a server at
          an address like 192.168.1.5.
        ITSAppUsesNonExemptEncryption: false
        # **Tips restore the supporter status from the purchase history.** The tips
        # are consumables, and without this key `Transaction.all` leaves finished
        # consumables out, so a reinstall or a new device would forget the supporter.
        # Available from iOS 18, tvOS 18 and macOS 15, our minimum versions.
        SKIncludeConsumableInAppPurchaseHistory: true
    settings:
      base:
        # **No separate Mac build number.** All three platforms share the global
        # counter; two places for the same number are one too many. It must stay
        # higher than any build already uploaded for the Mac.
        # So that the file itself is also called "Swiftly.app" and not after the
        # build target - see `CFBundleName`.
        PRODUCT_NAME: Swiftly
        PRODUCT_BUNDLE_IDENTIFIER: de.paulherter.swiftly
        # Same reason as on iOS and tvOS: without the access group the keychain
        # refuses writes (-34018) and the login would be lost on every launch.
        CODE_SIGN_ENTITLEMENTS: Sources/macOS/Swiftly.entitlements
        # The icon is **not** edge-to-edge: macOS expects padding (824 of 1024),
        # otherwise it looks larger than its neighbors in the Dock. iOS is the
        # opposite, hence a separate asset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
