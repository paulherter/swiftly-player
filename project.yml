name: Swiftly
options:
  bundleIdPrefix: de.paulherter
  # German is the source language; English comes from the catalog. Both ship
  # with the app.
  developmentLanguage: de
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  JellyfinKit:
    path: Packages/JellyfinKit
  # For the launch animation. The source asset is a Lottie export from After
  # Effects; the keyframes carry individual bezier easing, which is error-prone
  # to rebuild by hand. Airbnb's implementation is the standard one.
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Makes Xcode extract strings from Swift code into the catalog.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Must match the version in App Store Connect, otherwise the build cannot be
    # attached there. Do not attach another build to an already released
    # version; that does not work cleanly.
    MARKETING_VERSION: "1.0.9"
    # Must be incremented on EVERY upload: Apple does not accept the same build
    # number twice per version (error 90189).
    #
    # The counter applies per version, so it restarts at 1 for a new version.
    # Before resetting it, check the highest build number already uploaded for
    # that version on all platforms in App Store Connect.
    CURRENT_PROJECT_VERSION: "33"
    # Same identifier as in the free-account days: Apple converted the personal
    # team into the paid one instead of creating a second one.
    DEVELOPMENT_TEAM: 63L6TSM2Y9
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

fileGroups:
  - Sources/Shared/Localizable.xcstrings
  - Sources/Shared/InfoPlist.xcstrings
  # Local StoreKit testing; in the project for the scheme picker, in no target.
  # How to use it: StoreKit/README.md.
  - StoreKit

targets:
  Swiftly-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      # **Licenses come from one source**: `LICENSES/` (components.json and the
      # full texts) is copied into the bundle unchanged; `Lizenzbestand` reads
      # it.
      - path: LICENSES
        type: folder
    dependencies:
      - package: JellyfinKit
      - package: Lottie
      # VLCKit 4 provides Picture-in-Picture (VLCPictureInPictureDrawable), the
      # reason for this app. Included locally instead of via SwiftPM because
      # VideoLAN throttles the download to ~40 KB/s. Fetch with:
      # Werkzeuge/vlckit-fetch.sh
      # **Self-built version** - see Werkzeuge/vlckit-patches/README.md. VLC 4
      # cannot seek forward in a Matroska with partly unreadable cues over HTTP;
      # patch 0028 restores the VLC 3 behavior.
      - framework: Vendor/VLCKit-gepatcht.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/iOS/Info.plist
      properties:
        # **The fallback language, not the source language.**
        #
        # German stays the key in the catalog. A device set to neither German
        # nor English (Dutch, Russian, Chinese) gets exactly this value: Apple's
        # last fallback level is CFBundleDevelopmentRegion (QA1828). With `de`
        # here, much of the world saw a German app.
        #
        # Not via `options.developmentLanguage`: that is the project's source
        # language and stays German.
        # **Without this key iOS caps the app at 60 Hz**, even on a device that
        # can do 120. Apple made this opt-in on purpose to save battery; for a
        # video app it is the difference between smooth and juddery.
        #
        # Why it matters: 24p does not fit 60 Hz. 60 / 23.976 = 2.503, so each
        # frame is held for two or three refreshes alternately (the classic 3:2
        # cadence), most visible in pans. At 120 Hz it is 5.005, which works out
        # almost exactly.
        #
        # Measured: VLC delivered every frame on time (none dropped or late,
        # hardware decoder, log silent) and the judder was still there. It
        # arises at display time, beyond anything VLC sees.
        #
        # iPad Pro does not need the key, according to Apple.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Swiftly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Without a color, white flashes briefly before the launch animation.
        UILaunchScreen:
          UIColorName: StartBackground
        # All four are required: without UIRequiresFullScreen an app with "1,2"
        # counts as multitasking-capable, and Apple then requires the full set.
        # Without PortraitUpsideDown the upload check fails, not only the
        # review.
        #
        # This is only the outer frame. What applies is decided at runtime by
        # `Orientierung`: on iPhone it stays portrait, the player may rotate. On
        # iPad the frame applies unchanged, since a multitasking-capable app
        # must not force rotation.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required for Picture-in-Picture: without 'audio' as background mode
        # iOS ends playback as soon as the window gets small.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          # **Only this one key, on purpose.**
          #
          # Adding `NSAllowsLocalNetworking` next to it is wrong: **since iOS
          # 10, `NSAllowsArbitraryLoads` is ignored as soon as
          # `NSAllowsLocalNetworking`, `NSAllowsArbitraryLoadsInWebContent` or
          # `...ForMedia` is present.** The keys do not complement each other;
          # the second disables the first.
          #
          # This blocked users reaching Jellyfin over Tailscale
          # (`http://100.x.x.x:8096`): Tailscale uses 100.64.0.0/10, the CGNAT
          # range, which ATS does **not** count as local network (RFC1918,
          # `.local` and `localhost` are). The same block hit plain-http
          # dynamic-DNS hostnames.
          #
          # A client for self-hosted servers cannot know the address at build
          # time, so `NSExceptionDomains` do not help. Swiftly steers towards
          # https in code instead: an address without scheme gets `https://`
          # prepended unless it looks like a home network
          # (`AppModelURLNormalizer`, IP literals included). It falls back to
          # http only if https fails at the connection level, never on an error
          # response.
          NSAllowsArbitraryLoads: true
        # **Required since iOS 14; without it the error is hard to interpret.**
        #
        # The system asks for permission before an app talks to devices on the
        # local network, even for a direct IP, not only `.local`. If the user
        # denies, URLSession reports "The Internet connection appears to be
        # offline" although the network is fine. This sentence is shown in the
        # prompt itself and is the only chance to explain why the app wants it.
        #
        # **English as default, German from `InfoPlist.xcstrings`.** A
        # hard-coded plist value is not translated; it appears as written. Since
        # `CFBundleDevelopmentRegion` is `en`, this sentence must be English
        # too.
        NSLocalNetworkUsageDescription: Swiftly looks for your Jellyfin server
          on your home network. Without this, the app cannot reach a server at
          an address like 192.168.1.5.
        # Otherwise App Store Connect asks about export compliance on every
        # upload. The app does no encryption itself, only HTTPS through system
        # APIs, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # **Tips restore the supporter status from the purchase history.** The tips
        # are consumables, and without this key `Transaction.all` leaves finished
        # consumables out, so a reinstall or a new device would forget the supporter.
        # Available from iOS 18, tvOS 18 and macOS 15, our minimum versions.
        SKIncludeConsumableInAppPurchaseHistory: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.paulherter.swiftly
        # iPhone and iPad. The former reasons to exclude iPad are resolved:
        # PortraitUpsideDown is in the orientations above, and views read their
        # width instead of hard-wiring three columns (`Stil.spalten(fuer:)`).
        #
        # Deliberately **without** UIRequiresFullScreen: the app should run in
        # split screen. The price is the orientation requirement above.
        TARGETED_DEVICE_FAMILY: "1,2"
        # A single 1024 image without separate dark and tinted variants; iOS
        # derives those from it. Enough for submission; separate variants would
        # be an improvement, not a requirement.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # **Six supporter icons** next to the regular one (`SupporterIcon`). Only
        # icons named here are compiled as alternates; the names are strings the
        # code passes to `setAlternateIconName`.
        #
        # `AppIcon-NeonNight` and `AppIcon-Halloween` belong to the looks of the same
        # name (`Look.iconName`); the look switches them, not the icon picker.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Heart AppIcon-Aurora AppIcon-Gold AppIcon-Light AppIcon-Night AppIcon-Coffee AppIcon-NeonNight AppIcon-Halloween AppIcon-LookSunset AppIcon-LookAurora AppIcon-LookIce AppIcon-LookEmber AppIcon-LookGold AppIcon-LookEmerald"
        # Without entitlements the keychain refuses writes (-34018) and the
        # login would be lost on every launch.
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/Swiftly.entitlements

  Swiftly-tvOS:
    type: application
    platform: tvOS
    # Deliberately **not** all of `Sources/Shared`: it contains swipe gestures,
    # the bottom nav bar, tap areas and keyboard types that do not exist on
    # tvOS. Only what is independent of distance and input method is shared:
    # state holders, keychain, brands, routes, colors. Each platform has its own
    # views.
    sources:
      # **One manifest for all platforms.**
      #
      # It used to live in `Sources/iOS` and was only picked up there because
      # the whole directory is collected. tvOS and macOS pick files from
      # `Shared` individually and so had none; Apple sends the ITMS-91053 notice
      # for that. The entries are identical on all three, so they exist once.
      - path: Sources/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Shared/AppModel.swift
      # **Only the management, not the views.** Downloads exist only on iPhone
      # and iPad, but `AppModel` holds them and `AppModel` is shared. The class
      # sits idle here: `downloadsAn` is off, so neither the network watcher nor
      # the background session ever starts.
      - path: Sources/Shared/DownloadManager.swift
      - path: Sources/Shared/LoginModel.swift
      - path: Sources/Shared/PlayRequest.swift
      - path: Sources/Shared/Colors.swift
      # The active look: `Theme.accent` reads from it.
      - path: Sources/Shared/LookStore.swift
      # The gift's flow (What's New, the offer, picking it up, the looks panel's state) is
      # shared; its views are guarded `#if !os(tvOS)` and Apple TV draws its own
      # (`Sources/tvOS/TVLooks.swift`).
      - path: Sources/Shared/LookGiftSheet.swift
      - path: Sources/Shared/Motion.swift
      - path: Sources/Shared/GridJump.swift
      # The flow around a purchase (looks panel, sheet, thank-you page) and SupportChoice.
      - path: Sources/Shared/SupportFlow.swift
      - path: Sources/Shared/Keychain.swift
      - path: Sources/Shared/Marks.swift
      - path: Sources/Shared/Routes.swift
      - path: Sources/Shared/TitleAction.swift
      - path: Sources/Shared/TitleMark.swift
      # Container, codec, subtitles in the file excerpt - same info everywhere.
      # Which bitrates, skip lengths and languages are offered.
      # Row title, badge, loader, profile glyph - building blocks without
      # platform dimensions. They used to exist three times; the target now
      # passes the dimensions as a parameter, see `Lader.far` in Style.swift.
      - path: Sources/Shared/Components.swift
      # **The image cache `Profilzeichen` depends on.** It remembers what was
      # already fetched and answers synchronously - only so a known profile
      # image appears in the first pass instead of after a gradient flash. tvOS
      # keeps its own `Bild` building block for tiles.
      - path: Sources/Shared/NetworkImage.swift
      # VLC's counters and the tech badge above them - shared by all platforms
      # since the badge exists everywhere.
      - path: Sources/Shared/PlayValues.swift
      # The next-episode card at the end of an episode: frame, ring, gradient;
      # each platform draws the card itself.
      - path: Sources/Shared/EpisodeCardParts.swift
      # Plan and file start of the next episode in the last minutes (rules in
      # `Vorpuffer` in the package) - iPhone and TV.
      - path: Sources/Shared/EpisodePreparation.swift
      # Account switch as animation - flight, stage, staggered rows; iPhone and
      # TV.
      - path: Sources/Shared/AccountTransition.swift
      - path: Sources/Shared/AccountSwitchStageUIKit.swift
      # Spring and "out of the point" - the selection grows from the badge.
      - path: Sources/Shared/Transitions.swift
      # The menu behind a long press on any tile - on TV without preview and
      # without "Download".
      - path: Sources/Shared/TileMenu.swift
      - path: Sources/Shared/TechBadge.swift
      - path: Sources/Shared/QuickConnectModel.swift
      - path: Sources/Shared/PlaybackHub.swift
      # Offline self-test (`-offlinelauf`), only active in Debug builds.
      - path: Sources/Shared/OfflineRun.swift
      - path: Sources/Shared/DiscordIndicator.swift
      # Trakt: keychain, sign-in state, the calls from AppModel.
      - path: Sources/Shared/TraktAccount.swift
      - path: Sources/Shared/HomePageModel.swift
      # Seerr - the integration itself; views stay platform-specific.
      - path: Sources/Shared/SeerrModel.swift
      - path: Sources/Shared/SeerrMark.swift
      # The version string for the profile page - one computation, three views.
      - path: Sources/Shared/Version.swift
      # "Support Swiftly": StoreKit, watch time and when to ask; views per platform.
      - path: Sources/Shared/SupportModel.swift
      - path: Sources/Shared/LibraryModel.swift
      - path: Sources/Shared/WatchlistModel.swift
      # **The series store existed a second time here.** The shared file was
      # extracted from this version, but tvOS kept its copy, which lacked what
      # extraction added: the question which account the content belongs to.
      # After an account switch, foreign checkmarks and progress bars showed up.
      - path: Sources/Shared/SeriesCache.swift
      - path: Sources/Shared/SVGPath.swift
      # Both platforms share the playback machinery: the same `mkv_trusted`
      # trick, the same stall detection. Picture-in-Picture in it is excluded
      # with `#if os(iOS)`.
      # Carries the platform's view class. VLCPlayer depends on it since there
      # is also an AppKit arm.
      - path: Sources/Shared/BaseView.swift
      - path: Sources/Shared/VLCPlayer.swift
      - path: Sources/Shared/NetworkProbe.swift
      # Preview images while scrubbing: fetching and caching of the trickplay
      # sheets, shared with iPhone and Mac.
      - path: Sources/Shared/TrickplayImages.swift
      # The timeline in pieces, one per chapter - same mask as on iPhone and
      # Mac.
      - path: Sources/Shared/ChapterMask.swift
      # Handover between devices: polling interval and state.
      - path: Sources/Shared/TakeoverModel.swift
      # "Continue watching here" as a card: stage above everything and the exit
      # of the handing-over device; timeline in the package (`Uebergabekarte`).
      - path: Sources/Shared/HandoffStage.swift
      # Watch together: the group mirror and the bridge to the player. The flow
      # itself is in the package (`SyncPlaySitzung`).
      - path: Sources/Shared/SharedModel.swift
      - path: Sources/Shared/Localizable.xcstrings
      # Only for the local-network prompt: English is in Info.plist, German
      # comes from here.
      - path: Sources/Shared/InfoPlist.xcstrings
      - path: Sources/Shared/ShelfPreview.swift
      # The launch animation belongs on both platforms - the mark should animate
      # the same way everywhere. Only the square is larger on TV.
      - path: Sources/Shared/StartAnimation.swift
      - path: Sources/Shared/Assets
      - path: Sources/Shared/Licenses.swift
      # The tones of a backdrop image - TV tints its detail pages with them,
      # iPhone the background below.
      - path: Sources/Shared/ImageTone.swift
      - path: Sources/tvOS
      # **Licenses come from one source**: `LICENSES/` (components.json and the
      # full texts) is copied into the bundle unchanged; `Lizenzbestand` reads
      # it.
      - path: LICENSES
        type: folder
    dependencies:
      - package: JellyfinKit
      - package: Lottie
      # The Top Shelf is a separate target and is embedded.
      - target: Swiftly-TopShelf
      # VLCKit 4 ships tvOS slices (tvos-arm64 and simulator, checked in the
      # XCFramework). No Picture-in-Picture here, but the player is used, and
      # with it the `mkv_trusted` trick.
      # **Self-built version with a patch to the mkv seeker.**
      #
      # VLC 4 ties `index_range()` to `b_fastseekable`, which is never true over
      # HTTP. A Matroska whose cues cannot be evaluated then has no way to seek
      # forward: every seek lands at the file start and the demuxer reads
      # forward, 30 to 90 seconds in the test episode. VLC 3 calls the same line
      # without that condition, which is why other clients seek instantly in the
      # same file.
      #
      # Built from VLCKit 4.0.0-a23 plus this one patch. Revert to
      # `VLCKit.xcframework` if it does not hold up.
      - framework: Vendor/VLCKit-gepatcht.xcframework
        embed: true
        codeSign: true
    info:
      path: Sources/tvOS/Info.plist
      properties:
        # **The fallback language, not the source language.**
        #
        # German stays the key in the catalog. A device set to neither German
        # nor English (Dutch, Russian, Chinese) gets exactly this value: Apple's
        # last fallback level is CFBundleDevelopmentRegion (QA1828). With `de`
        # here, much of the world saw a German app.
        #
        # Not via `options.developmentLanguage`: that is the project's source
        # language and stays German.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Swiftly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # **Without this the app falls back to 1 while the Top Shelf is at 2.**
        # Xcode warns at build time and App Store Connect rejects the upload: an
        # extension's build number must match its app's.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Same reason as on iOS: the app does no encryption itself, it uses
        # HTTPS through system APIs.
        ITSAppUsesNonExemptEncryption: false
        # **Tips restore the supporter status from the purchase history.** The tips
        # are consumables, and without this key `Transaction.all` leaves finished
        # consumables out, so a reinstall or a new device would forget the supporter.
        # Available from iOS 18, tvOS 18 and macOS 15, our minimum versions.
        SKIncludeConsumableInAppPurchaseHistory: true
        # Belongs **here**, not in Info.plist: that file is generated by
        # XcodeGen from these entries and overwritten on every run. A hand edit
        # lasts only until the next `xcodegen generate`, and the Top Shelf would
        # lead nowhere.
        CFBundleURLTypes:
          - CFBundleURLName: de.paulherter.swiftly
            CFBundleURLSchemes:
              - swiftly
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          # **Only this one key, on purpose.**
          #
          # Adding `NSAllowsLocalNetworking` next to it is wrong: **since iOS
          # 10, `NSAllowsArbitraryLoads` is ignored as soon as
          # `NSAllowsLocalNetworking`, `NSAllowsArbitraryLoadsInWebContent` or
          # `...ForMedia` is present.** The keys do not complement each other;
          # the second disables the first.
          #
          # This blocked users reaching Jellyfin over Tailscale
          # (`http://100.x.x.x:8096`): Tailscale uses 100.64.0.0/10, the CGNAT
          # range, which ATS does **not** count as local network (RFC1918,
          # `.local` and `localhost` are). The same block hit plain-http
          # dynamic-DNS hostnames.
          #
          # A client for self-hosted servers cannot know the address at build
          # time, so `NSExceptionDomains` do not help. Swiftly steers towards
          # https in code instead: an address without scheme gets `https://`
          # prepended unless it looks like a home network
          # (`AppModelURLNormalizer`, IP literals included). It falls back to
          # http only if https fails at the connection level, never on an error
          # response.
          NSAllowsArbitraryLoads: true
        # **Required since iOS 14; without it the error is hard to interpret.**
        #
        # The system asks for permission before an app talks to devices on the
        # local network, even for a direct IP, not only `.local`. If the user
        # denies, URLSession reports "The Internet connection appears to be
        # offline" although the network is fine. This sentence is shown in the
        # prompt itself and is the only chance to explain why the app wants it.
        #
        # **English as default, German from `InfoPlist.xcstrings`.** A
        # hard-coded plist value is not translated; it appears as written. Since
        # `CFBundleDevelopmentRegion` is `en`, this sentence must be English
        # too.
        NSLocalNetworkUsageDescription: Swiftly looks for your Jellyfin server
          on your home network. Without this, the app cannot reach a server at
          an address like 192.168.1.5.
    settings:
      base:
        MARKETING_VERSION: "1.0.10"
        PRODUCT_BUNDLE_IDENTIFIER: de.paulherter.swiftly
        # Same reason as on iOS: without the access group the keychain refuses
        # writes (-34018) and the login would be lost on every launch.
        CODE_SIGN_ENTITLEMENTS: Sources/tvOS/Swiftly.entitlements
        # tvOS requires a **layered** icon, not a flat image: base tone at the
        # back, wordmark in front, with the parallax computed by the system in
        # between. Generated from the same source the app uses to draw its
        # wordmark.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # **Six supporter icons**, each a layered image stack like the regular one, next to the regular one (`SupporterIcon`). Only
        # icons named here are compiled as alternates; the names are strings the
        # code passes to `setAlternateIconName`.
        # tvOS has no icon switching, and App Store Connect rejects alternate icons without
        # a 1280x768 App Store layer (error 90471), so none are declared here.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: ""

  # The row above the app icon on the Apple TV home screen.
  #
  # Separate process, separate entitlements: it only reads the list the app puts
  # into the shared folder. No JellyfinKit, no VLCKit, no server request - it is
  # invoked on every focus on the icon and must show something within fractions
  # of a second.
  Swiftly-TopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: Sources/Shared/ShelfPreview.swift
      - path: Sources/TopShelf
    info:
      path: Sources/TopShelf/Info.plist
      properties:
        # **The fallback language, not the source language.**
        #
        # German stays the key in the catalog. A device set to neither German
        # nor English (Dutch, Russian, Chinese) gets exactly this value: Apple's
        # last fallback level is CFBundleDevelopmentRegion (QA1828). With `de`
        # here, much of the world saw a German app.
        #
        # Not via `options.developmentLanguage`: that is the project's source
        # language and stays German.
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Swiftly Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # **Needed here too, although the extension fetches nothing itself.**
        #
        # It only hands the system image URLs (`setImageURL`); loading happens
        # outside. If the images are on a server reachable only over http, ATS
        # decides as well, and an empty shelf would be an error nobody links to
        # a missing plist key. Setting it costs nothing.
        NSAppTransportSecurity:
          # See app target: the second key would disable the first.
          NSAllowsArbitraryLoads: true
        # **Without this App Store Connect rejects the upload** (error 90502):
        # an extension with a 64-bit slice must name `arm64` itself. The app
        # target does not need it, as Xcode sets the key on its own. For
        # `app-extension` it does not, and the problem only shows on upload:
        # build, archive and export all pass.
        UIRequiredDeviceCapabilities:
          - arm64
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShelfProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.paulherter.swiftly.topshelf
        MARKETING_VERSION: "1.0.10"
        CODE_SIGN_ENTITLEMENTS: Sources/TopShelf/TopShelf.entitlements

  # The Mac version.
  #
  # As with TV, **not** all of `Sources/Shared`: it contains swipe gestures, the
  # bottom bar, tap areas and keyboard types that do not exist on the Mac, and
  # `Style.swift` carries the iPhone dimensions, replaced here by
  # `Sources/macOS/Style.swift`. Shared is what is independent of input method
  # and window size.
  Swiftly-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Shared/AppModel.swift
      # **Only the management, not the views.** Downloads exist only on iPhone
      # and iPad, but `AppModel` holds them and `AppModel` is shared. The class
      # sits idle here: `downloadsAn` is off, so neither the network watcher nor
      # the background session ever starts.
      - path: Sources/Shared/DownloadManager.swift
      - path: Sources/Shared/LoginModel.swift
      - path: Sources/Shared/PlayRequest.swift
      # The home page loads identically for all platforms, and has to, or they
      # drift apart: the Mac version had rebuilt it and lost
      # `naechsteFolge(ohne:)`, so started titles appeared twice on the page.
      - path: Sources/Shared/HomePageModel.swift
      # Seerr - the integration itself; views stay platform-specific.
      - path: Sources/Shared/SeerrModel.swift
      - path: Sources/Shared/SeerrMark.swift
      # The version string for the profile page - one computation, three views.
      - path: Sources/Shared/Version.swift
      # "Support Swiftly": StoreKit, watch time and when to ask; views per platform.
      - path: Sources/Shared/SupportModel.swift
      # Series, seasons and episodes in memory - shared once instead of built
      # twice, with its own account check.
      - path: Sources/Shared/SeriesCache.swift
      # Trickplay preview images while scrubbing - used to live under
      # Sources/iOS although the code was already platform-neutral (only
      # CoreGraphics/ImageIO).
      - path: Sources/Shared/TrickplayImages.swift
      # The timeline in pieces, one per chapter - as on iPhone and TV.
      - path: Sources/Shared/ChapterMask.swift
      # Image loader with its own cache - decodes off the main thread.
      - path: Sources/Shared/PlayValues.swift
      - path: Sources/Shared/TechBadge.swift
      - path: Sources/Shared/NetworkImage.swift
      - path: Sources/Shared/LibraryModel.swift
