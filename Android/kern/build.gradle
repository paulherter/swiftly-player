// **Der Kern: JellyfinKit fuer Android.**
//
// Baut das Swift-Paket unter kern/swift mit swiftly fuer die Android-ABIs,
// kopiert die .so-Dateien samt Swift-Laufzeit in jniLibs und gibt die von
// jextract erzeugten Java-Huellen als Quellen weiter. Vorbild:
// swiftlang/swift-android-examples, hello-swift-java/hashing-lib.
plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace "de.paulherter.swiftly.kern"
    compileSdkVersion 36
    defaultConfig { minSdkVersion 28 }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(libs.swiftkit.core)
}

def swiftlyPfad = "${System.getProperty('user.home')}/.swiftly/bin/swiftly"
def swiftFassung = "6.3.3"
def sdkBuendel = "${System.getProperty('user.home')}/Library/org.swift.swiftpm/swift-sdks/swift-${swiftFassung}-RELEASE_android.artifactbundle"

// **FoundationNetworking gehoert dazu.** Im Beispiel fehlt sie, weil es kein
// Netz braucht; JellyfinKit laedt ueber URLSession, und ohne die Bibliothek
// scheitert das Laden von libSwiftlyKern.so zur Laufzeit.
def swiftLaufzeit = [
    "swiftCore", "swift_Concurrency", "swift_StringProcessing", "swift_RegexParser",
    "swift_Builtin_float", "swift_math", "swiftAndroid", "dispatch", "BlocksRuntime",
    "swiftSwiftOnoneSupport", "swiftDispatch", "swiftSynchronization", "swiftObservation",
    "Foundation", "FoundationEssentials", "FoundationInternationalization", "_FoundationICU",
    "FoundationNetworking"
]

// arm64 und 32-Bit-ARM. Viele Fernseher (auch mit 64-Bit-Chip) haben ein 32-Bit-Android
// und melden nur armeabi-v7a; ohne diese ABI zeigt Play ihnen die App gar nicht an.
def abis = [
    "arm64-v8a": [triple: "aarch64-unknown-linux-android28", sdkLib: "swift-aarch64", ndk: "aarch64-linux-android"],
    "armeabi-v7a": [triple: "armv7-unknown-linux-android28", sdkLib: "swift-armv7", ndk: "arm-linux-androideabi"],
]

def swiftOrdner = layout.projectDirectory.dir("swift")
def jniAusgabe = layout.buildDirectory.dir("generated/jniLibs")

def swiftBauen = tasks.register("swiftBauen") {
    group = "build"
    description = "Baut SwiftlyKern fuer alle Android-ABIs."
    inputs.file(swiftOrdner.file("Package.swift"))
    inputs.dir(swiftOrdner.dir("Sources"))
    inputs.dir(layout.projectDirectory.dir("../../Packages/JellyfinKit/Sources"))
    outputs.dir(swiftOrdner.dir(".build/plugins/outputs/swift/SwiftlyKern/destination/JExtractSwiftPlugin/src/generated/java"))
}
abis.each { abi, info ->
    def t = tasks.register("swiftBauen${abi.replace('-', '').capitalize()}", Exec) {
        workingDir = swiftOrdner
        executable(swiftlyPfad)
        args("run", "swift", "build", "+${swiftFassung}", "--swift-sdk", info.triple, "--build-system", "native")
        environment("ANDROID_NDK_HOME", "${System.getProperty('user.home')}/Library/Android/sdk/ndk/27.3.13750724")
        // **Das macOS-SDK fest auf 26.5.** Am 15.09.2026 haben sich die CommandLineTools still auf
        // macOS 27 aktualisiert; `MacOSX.sdk` zeigte danach auf 27.0, dessen libSystem.B.tbd die
        // Architektur `arm64e.x1` nennt — der Linker von Swift 6.3.3 kennt sie nicht, und schon das
        // Paket-Manifest liess sich nicht mehr linken. Mit einem neueren Swift wieder freigeben.
        environment("SDKROOT", "/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk")
    }
    swiftBauen.configure { dependsOn(t) }
}

def jniKopieren = tasks.register("jniKopieren", Copy) {
    dependsOn(swiftBauen)
    abis.each { abi, info ->
        from(swiftOrdner.dir(".build/${info.triple}/debug")) { include("*.so"); into(abi) }
        from(file("${sdkBuendel}/swift-android/ndk-sysroot/usr/lib/${info.ndk}/libc++_shared.so")) { into(abi) }
        from(swiftLaufzeit.collect { "${sdkBuendel}/swift-android/swift-resources/usr/lib/${info.sdkLib}/android/lib${it}.so" }) { into(abi) }
    }
    into(jniAusgabe)
}

// **Die Uebersetzungen des Pakets reisen als Assets mit.** `Bundle.module` gibt es
// in einer .so nicht; die App entpackt den Ordner und nennt ihn dem Paket
// (`Kern.paketspracheSetzen`).
def paketspracheAusgabe = layout.buildDirectory.dir("generated/paketsprache")
def paketspracheKopieren = tasks.register("paketspracheKopieren", Copy) {
    dependsOn(swiftBauen)
    from(swiftOrdner.dir(".build/aarch64-unknown-linux-android28/debug/JellyfinKit_JellyfinKit.resources")) {
        into("paketsprache")
    }
    into(paketspracheAusgabe)
}

android {
    sourceSets {
        main {
            java { srcDir(swiftBauen) }
            jniLibs { srcDir(jniAusgabe) }
            assets { srcDir(paketspracheAusgabe) }
        }
    }
}
preBuild.dependsOn(jniKopieren)
preBuild.dependsOn(paketspracheKopieren)
