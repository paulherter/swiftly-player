# Die Fassungen folgen dem offiziellen swift-android-examples-Stand, gegen den die
# Werkzeugkette am 14.09.2026 geprueft wurde. Hochziehen erst, wenn das hier laeuft.
[versions]
agp = "8.13.0"
kotlin = "2.0.21"
coreKtx = "1.16.0"
lifecycleRuntimeKtx = "2.9.2"
activityCompose = "1.10.1"
composeBom = "2024.09.00"
coroutines = "1.10.2"
# Dieselbe Maschine wie auf Apple, Linux und Windows — Direct Play verhaelt sich gleich.
libvlc = "3.6.3"
# 3.0.4 passt zu Kotlin 2.0.21; neuere Coil-Fassungen verlangen neuere Kotlin-Metadaten.
coil = "3.0.4"
# Dieselbe Startanimation wie auf Apple (`Startanimation.swift` spielt sie mit Lottie ab).
lottie = "6.5.2"
# Googles Bewertungsdialog — das Gegenstueck zu `requestReview` auf iOS.
playReview = "2.0.2"
# Fuer die Watch-Next-Reihe auf Android TV (`TvContractCompat`) — das Gegenstueck zum
# Top Shelf auf tvOS. Einzige stabile Fassung; seither nur Alpha-Nachfolger.
tvprovider = "1.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
androidx-tvprovider = { group = "androidx.tvprovider", name = "tvprovider", version.ref = "tvprovider" }
libvlc-all = { group = "org.videolan.android", name = "libvlc-all", version.ref = "libvlc" }
swiftkit-core = { group = "org.swift.swiftkit", name = "swiftkit-core", version = "+" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
