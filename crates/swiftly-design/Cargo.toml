[package]
name = "swiftly-design"
description = "Design tokens (colours, spacing, radii, sizes, type, shadow, motion) generated from the Swiftly design file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gen_tokens"
path = "src/bin/gen_tokens.rs"

# Only the generator binary uses these; a crate that depends on the library does not compile them.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints]
workspace = true
