[package]
name = "swiftly-design"
description = "Token constants (colours, spacing, radii, sizes, type, shadow, motion) shared by the Swiftly UIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

# The generator and lint binaries (src/bin) are found by their file names; they are not part of the public tree.
# Only they use these dependencies; a crate that depends on the library does not compile them.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints]
workspace = true
