[package]
name = "swiftly-plex"
description = "Plex Media Server support of the Swiftly core: wire models, mapping, PIN sign-in, connection choice, client, playback addresses, BIF previews, MediaServer binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["reqwest"]
# Forwarded to swiftly-net: the default reqwest transport.
reqwest = ["swiftly-net/reqwest"]

[dependencies]
swiftly-net = { path = "../swiftly-net", default-features = false }
swiftly-model = { path = "../swiftly-model" }
swiftly-jellyfin = { path = "../swiftly-jellyfin", default-features = false }
swiftly-playback = { path = "../swiftly-playback" }
swiftly-library = { path = "../swiftly-library" }
swiftly-rules = { path = "../swiftly-rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "std"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
futures-executor = "0.3"

[lints]
workspace = true

[[bench]]
name = "page"
harness = false
