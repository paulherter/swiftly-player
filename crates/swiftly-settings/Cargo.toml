[package]
name = "swiftly-settings"
description = "Typed settings over a key-value store; persisted German keys unchanged; settings-sync rules ported from JellyfinKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swiftly-atomic = { path = "../swiftly-atomic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[lints]
workspace = true
