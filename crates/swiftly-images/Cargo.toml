[package]
name = "swiftly-images"
description = "Image logic of the Swiftly core: addresses per server kind, image choice, cache keys, disk and memory caches, tone and mood maths. No decoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swiftly-atomic = { path = "../swiftly-atomic" }
swiftly-model = { path = "../swiftly-model" }
swiftly-jellyfin = { path = "../swiftly-jellyfin", default-features = false }
swiftly-playback = { path = "../swiftly-playback" }
url = "2"
zune-jpeg = "0.5.15"
image-webp = "0.2.4"
futures-executor = { version = "0.3", features = ["thread-pool"] }
png = "0.18"
swiftly-net = { version = "0.1.0", path = "../swiftly-net", default-features = false }
zune-core = "0.5"
fast_image_resize = "5"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
swiftly-plex = { path = "../swiftly-plex", default-features = false }
serde_json = "1"
jpeg-encoder = "0.7.1"
divan = "0.1.21"

[lints]
workspace = true

[[bench]]
name = "images"
harness = false
