[package]
name = "swiftly-cache"
description = "Persistent normalised entity cache of the Swiftly core: items by id, lists by query key, SQLite (WAL), stale-while-revalidate, event invalidation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swiftly-library = { path = "../swiftly-library" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
